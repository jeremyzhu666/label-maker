<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Label Maker</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --text:#1a1a2e;--dim:#6b7280;--border:#e5e7eb;--bg:#fff;--hover:#f9fafb;
      --font:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','SimHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
    a{color:var(--text);text-decoration:none}
    /* sidebar */
    .sidebar{position:fixed;top:0;left:0;width:260px;height:100vh;border-right:1px solid var(--border);background:var(--bg);padding:28px 20px;overflow-y:auto;z-index:10}
    .sidebar .app-name{font-size:15px;font-weight:700;margin-bottom:20px;letter-spacing:.3px}
    .sidebar ul{list-style:none}
    .sidebar li{margin:2px 0}
    .sidebar a{display:block;padding:5px 12px;border-radius:6px;font-size:13px;color:var(--dim);transition:.12s}
    .sidebar a:hover{background:var(--hover);color:var(--text)}
    .sidebar a.active{color:var(--text);font-weight:600;background:var(--hover)}
    /* content */
    .content{margin-left:260px;padding:48px 56px;max-width:820px}
    .markdown-section h1{font-size:28px;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
    .markdown-section h2{font-size:20px;font-weight:600;margin:32px 0 12px}
    .markdown-section p{margin:12px 0;color:var(--text)}
    .markdown-section a{color:#3b82f6}
    .markdown-section a:hover{text-decoration:underline}
    .markdown-section table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px}
    .markdown-section th{text-align:left;font-weight:600;color:var(--dim);border-bottom:2px solid var(--border);padding:8px 12px}
    .markdown-section td{border-bottom:1px solid var(--border);padding:8px 12px}
    .markdown-section tr:hover{background:var(--hover)}
    .markdown-section code{font-family:'SF Mono','Monaco','Menlo',monospace;background:var(--hover);padding:2px 6px;border-radius:4px;font-size:13px;color:var(--text)}
    .markdown-section blockquote{border-left:3px solid var(--border);padding-left:16px;color:var(--dim);margin:16px 0}
    /* mobile */
    @media(max-width:768px){
      .sidebar{transform:translateX(-100%);transition:.25s}
      .sidebar.open{transform:translateX(0)}
      .content{margin-left:0;padding:24px 20px}
      .menu-toggle{display:flex}
    }
    .menu-toggle{display:none;position:fixed;top:14px;left:14px;z-index:20;width:36px;height:36px;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer;font-size:18px}
  </style>
</head>
<body>
  <div class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">≡</div>
  <aside class="sidebar">
    <div class="app-name">Label Maker</div>
    <ul>
      <li><a href="#/">首页</a></li>
      <li><a href="#/changelog">更新记录</a></li>
    </ul>
  </aside>
  <main class="content" id="app"></main>
  <script>
    window.$docsify = {
      el: '#app',
      loadSidebar: false,
      basePath: '/label-maker/docs/',
      auto2top: true,
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
</body>
</html>
