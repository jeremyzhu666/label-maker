<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Label Maker 标签生成工具</title>
<link rel="stylesheet" href="styles.css?v=5">
<!-- Barlow Condensed 只给 canvas 打印用,异步加载不阻塞首屏 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/barlow-condensed/300.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/barlow-condensed/400.css" media="print" onload="this.media='all'">
</head>
<body>
  <header>
    <h1>Label Maker</h1>
    <p>developed by 酷卡</p>
  </header>

  <div class="layout">
    <!-- 左栏:编辑 + 打印 -->
    <main class="col-main">

      <!-- 01 标签编辑 -->
      <section class="step">
        <div class="step-head">
          <h2>标签编辑</h2>
        </div>
        <div class="grid" id="inputGrid"></div>
      </section>

      <!-- 02 标签打印 -->
      <section class="step">
        <div class="step-head">
          <h2>标签打印</h2>
        </div>

        <div class="print-box" id="printBox">
          <div class="status-line">
            <span class="status-dot" id="statusDot"></span>
            <div class="status-text" id="statusText">
              正在检测浏览器 Web Bluetooth 支持
              <div class="status-sub" id="statusSub"></div>
            </div>
          </div>
          <div class="connect-row">
            <button class="btn-connect" id="btnConnect" disabled>连接打印机</button>
            <button class="btn-print" id="printBtn" disabled>立即打印</button>
          </div>
        </div>
      </section>

      <!-- 03 打印设置 -->
      <section class="step" id="printSelects" hidden>
        <div class="step-head">
          <h2>打印设置</h2>
        </div>
        <div class="select-row">
          <div>
            <label>打印浓度</label>
            <select id="selDensity">
              <option value="1">1 · 淡</option>
              <option value="2">2</option>
              <option value="3" selected>3 · 默认</option>
              <option value="4">4</option>
              <option value="5">5 · 深</option>
            </select>
          </div>
          <div>
            <label>份数</label>
            <div class="stepper" id="copiesStepper">
              <button type="button" class="stepper-btn" data-act="dec" aria-label="减少">−</button>
              <span class="stepper-val" id="copiesVal">1</span>
              <button type="button" class="stepper-btn" data-act="inc" aria-label="增加">+</button>
            </div>
            <input id="copies" type="hidden" value="1">
          </div>
          <div>
            <label>左右偏移</label>
            <input id="selOffsetX" type="number" min="-99" max="99" step="1" value="0" placeholder="0 · 范围 -99~+99">
          </div>
          <div>
            <label>上下偏移</label>
            <input id="selOffsetY" type="number" min="-99" max="99" step="1" value="0" placeholder="0 · 范围 -99~+99">
          </div>
        </div>
        <!-- 型号/尺寸/填充:功能保留,UI 隐藏 -->
        <select id="selModel" hidden></select>
        <select id="selLabel" hidden></select>
        <select id="selFit" hidden>
          <option value="contain">等比缩放居中（推荐）</option>
          <option value="cover">等比裁剪填满</option>
          <option value="stretch">拉伸填满</option>
        </select>
      </section>

    </main>

    <!-- 右栏:预览(sticky 常驻) -->
    <aside class="col-aside">
      <section class="step preview-section">
        <div class="step-head">
          <h2>标签预览</h2>
        </div>
        <div class="preview-wrap">
          <canvas id="canvas" width="800" height="600"></canvas>
        </div>
      </section>
    </aside>
  </div>

  <div class="toast" id="toast"></div>

<!-- niimbot.js + registry.js + app.js 都加 defer:DOM 解析后按顺序执行 -->
<script src="https://cdn.jsdelivr.net/npm/niimbot-web-bluetooth@2.4.0/src/niimbot.js" defer></script>
<script src="registry.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
