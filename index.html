<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Label Maker 标签生成工具</title>
<link rel="stylesheet" href="styles.css?v=15">
<!-- Barlow Condensed 只给 canvas 打印用,异步加载不阻塞首屏 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/barlow-condensed/300.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/barlow-condensed/400.css" media="print" onload="this.media='all'">
</head>
<body>
  <header>
    <div class="lang-switch" id="langSwitch">
      <button type="button" class="lang-btn" data-lang="zh" aria-label="中文">中</button>
      <span class="lang-sep">/</span>
      <button type="button" class="lang-btn" data-lang="en" aria-label="English">EN</button>
    </div>
    <h1 data-i18n="h1">Label Maker</h1>
    <p data-i18n="developedBy">developed by 酷卡创新</p>
  </header>

  <div class="layout">
    <!-- 左栏:编辑 + 打印 -->
    <main class="col-main">

      <!-- 01 标签编辑 -->
      <section class="step">
        <div class="step-head">
          <h2 data-i18n="sections.edit">标签编辑</h2>
        </div>
        <div class="grid" id="inputGrid">
          <div class="block-group">
            <input type="text" class="title-input" data-type="t" data-i="0" data-i18n-placeholder="input.titlePlaceholder" placeholder="模板标题" maxlength="12" value="名称">
            <input type="text" data-type="c" data-i="0" placeholder="Apple" maxlength="16">
          </div>
          <div class="block-group">
            <input type="text" class="title-input" data-type="t" data-i="1" data-i18n-placeholder="input.titlePlaceholder" placeholder="模板标题" maxlength="12" value="编号">
            <input type="text" data-type="c" data-i="1" placeholder="A01" maxlength="16">
          </div>
          <div class="block-group">
            <input type="text" class="title-input" data-type="t" data-i="2" data-i18n-placeholder="input.titlePlaceholder" placeholder="模板标题" maxlength="12" value="日期">
            <input type="text" data-type="c" data-i="2" placeholder="YYMMDD" maxlength="16">
          </div>
          <div class="block-group">
            <input type="text" class="title-input" data-type="t" data-i="3" data-i18n-placeholder="input.titlePlaceholder" placeholder="模板标题" maxlength="12" value="格式">
            <input type="text" data-type="c" data-i="3" placeholder="for MacOS" maxlength="16">
          </div>
        </div>
      </section>

      <!-- 02 标签打印 -->
      <section class="step">
        <div class="step-head">
          <h2 data-i18n="sections.print">标签打印</h2>
        </div>

        <div class="print-box" id="printBox">
          <div class="connect-row">
            <button class="btn btn-connect" id="btnConnect" disabled>
              <span class="status-dot" id="statusDot"></span>
              <span id="btnLabel" data-i18n="buttons.connect">连接打印机</span>
            </button>
            <button class="btn btn-print" id="printBtn" disabled data-i18n="buttons.print">立即打印</button>
          </div>
          <div class="status-sub" id="statusSub"></div>
        </div>
      </section>

      <!-- 03 打印设置 -->
      <section class="step" id="printSelects">
        <div class="step-head">
          <h2 data-i18n="sections.settings">打印设置</h2>
        </div>
        <div class="select-row">
          <div>
            <label data-i18n="settings.density">打印浓度</label>
            <div class="stepper" id="densityStepper">
              <button type="button" class="stepper-btn" data-act="dec" data-i18n-aria="aria.decrease" aria-label="减少">−</button>
              <span class="stepper-val" id="densityVal">3</span>
              <button type="button" class="stepper-btn" data-act="inc" data-i18n-aria="aria.increase" aria-label="增加">+</button>
            </div>
            <input id="selDensity" type="hidden" value="3">
          </div>
          <div>
            <label data-i18n="settings.copies">份数</label>
            <div class="stepper" id="copiesStepper">
              <button type="button" class="stepper-btn" data-act="dec" data-i18n-aria="aria.decrease" aria-label="减少">−</button>
              <span class="stepper-val" id="copiesVal">1</span>
              <button type="button" class="stepper-btn" data-act="inc" data-i18n-aria="aria.increase" aria-label="增加">+</button>
            </div>
            <input id="copies" type="hidden" value="1">
          </div>
          <div>
            <label data-i18n="settings.offsetX">左右偏移</label>
            <div class="stepper" id="offsetXStepper">
              <button type="button" class="stepper-btn" data-act="dec" data-i18n-aria="aria.decrease" aria-label="减少">−</button>
              <span class="stepper-val" id="offsetXVal">0</span>
              <button type="button" class="stepper-btn" data-act="inc" data-i18n-aria="aria.increase" aria-label="增加">+</button>
            </div>
            <input id="selOffsetX" type="hidden" value="0">
          </div>
          <div>
            <label data-i18n="settings.offsetY">上下偏移</label>
            <div class="stepper" id="offsetYStepper">
              <button type="button" class="stepper-btn" data-act="dec" data-i18n-aria="aria.decrease" aria-label="减少">−</button>
              <span class="stepper-val" id="offsetYVal">0</span>
              <button type="button" class="stepper-btn" data-act="inc" data-i18n-aria="aria.increase" aria-label="增加">+</button>
            </div>
            <input id="selOffsetY" type="hidden" value="0">
          </div>
        </div>
        <!-- 型号/尺寸/填充:功能保留,UI 隐藏 -->
        <select id="selModel" hidden></select>
        <select id="selLabel" hidden></select>
        <select id="selFit" hidden>
          <option value="contain">等比缩放居中（推荐）</option>
          <option value="cover">等比裁剪填满</option>
          <option value="stretch">拉伸填满</option>
        </select>
      </section>

    </main>

    <!-- 右栏:预览(sticky 常驻) -->
    <aside class="col-aside">
      <section class="step preview-section">
        <div class="step-head">
          <h2 data-i18n="sections.preview">标签预览</h2>
        </div>
        <div class="preview-wrap">
          <canvas id="canvas" width="800" height="600"></canvas>
        </div>
      </section>
    </aside>
  </div>

  <div class="toast" id="toast"></div>

  <footer>
    <p>酷卡创新 2026</p>
  </footer>

<!-- niimbot.js + i18n.js + registry.js + app.js 都加 defer:DOM 解析后按顺序执行 -->
<script src="https://cdn.jsdelivr.net/npm/niimbot-web-bluetooth@2.4.0/src/niimbot.js" defer></script>
<script src="i18n.js?v=3" defer></script>
<script src="registry.js?v=1" defer></script>
<script src="app.js?v=4" defer></script>
</body>
</html>
